# N62 — 4.0/4.4/4.8 NA V8 (Bosch ME9.2), E60/E63/E65 x40i–x50i, E53/E70 4.4i/
# 4.8i, 2001–2010. OBD-II entries are emissions-mandated and verified by
# design.
#
# N62 instrumentation context (apply when reading live data):
#   Coolant warm-up — watch for *slow* warm-up or creeping temps after
#     thermostat closure. Both are documented N62 valley-pan / coolant-pipe
#     failure modes; compare against the oil-temp cruise band below.
#   Oil-temp cruise band — a healthy N62 at sustained cruise holds oil
#     ~95–110 °C once fully warm. Oil temps consistently > coolant + 15 °C
#     point at a clogged engine-oil cooler (a known N62 failure mode).
#   Valvetronic — load is controlled by valve lift, not the throttle plate.
#     At part throttle the throttle reads high (mostly open) and load drops
#     as lift increases; the load/throttle trace is inversely correlated,
#     which is the opposite of a conventional engine. The throttle comment
#     on the `throttle` param below repeats this.
#   Idle voltage target — healthy alternator regulation at idle is
#     13.8–14.4 V. Sustained < 13.5 V with steady load points at a failing
#     voltage regulator (common N62 age-related failure); the `volt` param
#     is the load-bearing PID for that heuristic.
#
# Oil temp notes: SAE J1979 PID `0x5C` (engine oil temperature, byte - 40 °C)
# is the standard OBD-II oil-temp PID and is consistently reported on N62
# ME9.2 DMEs over K+DCAN. Bench verification on the E70 (slice 3 validation
# doc) is the gating step; the prior `local:10` placeholder has been removed.

[[profile]]
id = "n62"
label = "N62 4.0–4.8 NA V8 (ME9.2) [community]"

  [[profile.param]]
  id = "rpm"
  label = "Engine speed"
  unit = "rpm"
  target = 0x12
  query = "obd:0C"
  decode = "u16_quarter"
  min = 0.0
  max = 6800.0

  [[profile.param]]
  id = "coolant"
  label = "Coolant temp"
  unit = "°C"
  target = 0x12
  query = "obd:05"
  decode = "temp_u8"
  min = -40.0
  max = 150.0

  [[profile.param]]
  id = "oil"
  label = "Oil temp"
  unit = "°C"
  target = 0x12
  query = "obd:5C"
  decode = "temp_u8"
  min = -40.0
  max = 160.0

  [[profile.param]]
  id = "iat"
  label = "Intake air temp"
  unit = "°C"
  target = 0x12
  query = "obd:0F"
  decode = "temp_u8"
  min = -40.0
  max = 80.0

  [[profile.param]]
  id = "load"
  label = "Engine load"
  unit = "%"
  target = 0x12
  query = "obd:04"
  decode = "percent_a"
  min = 0.0
  max = 100.0

  # Valvetronic engine: at part throttle the throttle plate is mostly open and
  # load is controlled by valve lift, so throttle % behaves differently than
  # on a conventional engine — expect high readings at cruise.
  [[profile.param]]
  id = "throttle"
  label = "Throttle position"
  unit = "%"
  target = 0x12
  query = "obd:11"
  decode = "percent_a"
  min = 0.0
  max = 100.0

  [[profile.param]]
  id = "map"
  label = "Manifold pressure"
  unit = "kPa"
  target = 0x12
  query = "obd:0B"
  decode = "u8"
  min = 0.0
  max = 120.0

  [[profile.param]]
  id = "speed"
  label = "Vehicle speed"
  unit = "km/h"
  target = 0x12
  query = "obd:0D"
  decode = "u8"
  min = 0.0
  max = 300.0

  [[profile.param]]
  id = "volt"
  label = "Module voltage"
  unit = "V"
  target = 0x12
  query = "obd:42"
  decode = "u16_milli"
  min = 8.0
  max = 16.0

  # Rescued v0.8.0 PR #1 — this file was truncated mid-string at the volt
  # param's `label` line. The ambient entry below restores the canonical
  # emissions-mandated OBD-II tail shared by every shipped profile
  # (b58/n55/n20/s55); verified by design.

  [[profile.param]]
  id = "ambient"
  label = "Ambient temp"
  unit = "°C"
  target = 0x12
  query = "obd:46"
  decode = "temp_u8"
  min = -40.0
  max = 60.0
