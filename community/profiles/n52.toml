# N52 — 2.5/3.0 NA inline-6 (MSV70/MSV80), E9x/E60/E63/E83/E85/E86, 2004–2013.
# OBD-II entries are emissions-mandated and verified by design.
#
# N52 instrumentation context (apply when reading live data):
#   Oil-temp via BSD — the N52 DME reads oil condition via the BSD
#     (Bit Serial Data) protocol from the oil condition sensor, not
#     over KWP2000. The OBD-II PID `0x5C` (engine oil temperature,
#     byte - 40 °C) is the standard SAE J1979 path and is what the
#     desktop app surfaces; bench verification on the E9x is the
#     gating step. If the N52 DME on a given firmware responds with
#     an NRC (0x11 serviceNotSupported / 0x12 subFunctionNotSupported)
#     for `0x5C`, the entry is reverted to the `local:10` placeholder
#     per the harness-doc protocol (the v0.14.3 PR #187 per-PID NRC
#     surface is what flags this in the UI).
#   Coolant warm-up — N52 thermostat is the same family as the N62;
#     creeping temps after thermostat closure point at a failing
#     thermostat or water pump. Compare against the oil-temp band
#     below.
#   Oil-temp cruise band — a healthy N52 at sustained cruise holds
#     oil ~95–110 °C once fully warm. Oil consistently > coolant +
#     15 °C points at a clogged engine-oil cooler.
#   Valvetronic — load is controlled by valve lift, not the throttle
#     plate. At part throttle the throttle reads high (mostly open)
#     and load drops as lift increases; the load/throttle trace is
#     inversely correlated.
#   Idle voltage target — healthy alternator regulation at idle is
#     13.8–14.4 V. Sustained < 13.5 V with steady load points at a
#     failing voltage regulator; the `volt` param is the load-bearing
#     PID for that heuristic.
#
# Oil temp notes: SAE J1979 PID `0x5C` (engine oil temperature, byte
# - 40 °C) replaces the unverified `local:10` placeholder that
# v0.14.2 N62 slice 1 (PR #175) and v0.14.5 N5x slice 1 retired. The
# placeholder was a guess — the BSD oil-condition sensor is what
# N52 actually uses, but the OBD-II `0x5C` swap is the path the
# v0.14.2 + v0.14.3 + v0.14.5 N62 cycle established. Bench verification
# on the E9x 325i / 328i / 330i is the gating step (per the
# `docs/validation/n5x-real-car.md` harness doc, v0.14.5 slice 2).
#
# Fuel-rate + runtime notes (v0.14.5): the three new PIDs (`0x5E`
# fuel rate L/h, `0x5F` engine runtime s, `0x62` fuel rate g/s) are
# SAE J1979 emissions-mandated and consistently reported on
# OBD-II compliant ECUs. They mirror the v0.14.3 N62 enrichment
# (PR #186) so an E9x owner has the same per-chassis instrumentation
# an E70 owner has after running the N62 harness. Idle on a warm
# N52 should be ~1–2 L/h and ~1–2 g/s; wide-open throttle ~50–90
# L/h and ~40–70 g/s. Engine runtime s resets each ignition cycle;
# `0xFFFFFFFF` is the overflow sentinel. Verified by design as
# emissions-mandated OBD-II PIDs; bench verification on the E9x
# is the harness-doc gate.

[[profile]]
id = "n52"
label = "N52 2.5/3.0 NA I6 (MSV70/MSV80) [community]"

  [[profile.param]]
  id = "rpm"
  label = "Engine speed"
  unit = "rpm"
  target = 0x12
  query = "obd:0C"
  decode = "u16_quarter"
  min = 0.0
  max = 7000.0

  [[profile.param]]
  id = "coolant"
  label = "Coolant temp"
  unit = "°C"
  target = 0x12
  query = "obd:05"
  decode = "temp_u8"
  min = -40.0
  max = 150.0

  # v0.14.5 — SAE J1979 engine oil temperature (PID 0x5C, byte - 40 °C,
  # decoder temp_u8). Replaces the unverified `local:10` placeholder
  # that pre-dated the v0.14.2 N62 slice 1 enrichment. The N52 DME
  # reads oil condition via BSD, not KWP2000; the OBD-II `0x5C` path
  # is the standard SAE J1979 surface and is what the desktop app
  # surfaces. Bench verification on the E9x is the gating step —
  # if the DME returns an NRC (0x11 serviceNotSupported /
  # 0x12 subFunctionNotSupported) for `0x5C`, the harness-doc protocol
  # reverts to `local:10` (the v0.14.3 PR #187 per-PID NRC surface
  # surfaces this in the UI; the `remove_profile_pid` async command
  # writes the updated TOML behind a tauri-plugin-dialog
  # confirmation per the issue-#161 fix pattern).
  [[profile.param]]
  id = "oil"
  label = "Oil temp"
  unit = "°C"
  target = 0x12
  query = "obd:5C"
  decode = "temp_u8"
  min = -40.0
  max = 160.0

  [[profile.param]]
  id = "iat"
  label = "Intake air temp"
  unit = "°C"
  target = 0x12
  query = "obd:0F"
  decode = "temp_u8"
  min = -40.0
  max = 80.0

  [[profile.param]]
  id = "load"
  label = "Engine load"
  unit = "%"
  target = 0x12
  query = "obd:04"
  decode = "percent_a"
  min = 0.0
  max = 100.0

  # Valvetronic engine: at part throttle the throttle plate is mostly open
  # and load is controlled by valve lift, so throttle % behaves differently
  # than on a conventional engine — expect high readings at cruise.
  [[profile.param]]
  id = "throttle"
  label = "Throttle position"
  unit = "%"
  target = 0x12
  query = "obd:11"
  decode = "percent_a"
  min = 0.0
  max = 100.0

  # NA engine: manifold pressure reads as vacuum (well below ambient ~100 kPa
  # at idle, approaching ambient at WOT). Useful for spotting intake leaks
  # and DISA/valvetronic issues.
  [[profile.param]]
  id = "map"
  label = "Manifold pressure"
  unit = "kPa"
  target = 0x12
  query = "obd:0B"
  decode = "u8"
  min = 0.0
  max = 120.0

  [[profile.param]]
  id = "speed"
  label = "Vehicle speed"
  unit = "km/h"
  target = 0x12
  query = "obd:0D"
  decode = "u8"
  min = 0.0
  max = 300.0

  # Rescued v0.8.0 PR #1 — this file was truncated mid-key at the speed
  # param's `target` line. The tail below restores the canonical
  # emissions-mandated OBD-II block shared by every shipped profile
  # (b58/n55/n20/s55); all entries verified by design.

  [[profile.param]]
  id = "volt"
  label = "Module voltage"
  unit = "V"
  target = 0x12
  query = "obd:42"
  decode = "u16_milli"
  min = 8.0
  max = 16.0

  [[profile.param]]
  id = "ambient"
  label = "Ambient temp"
  unit = "°C"
  target = 0x12
  query = "obd:46"
  decode = "temp_u8"
  min = -40.0
  max = 60.0

  # v0.14.5 — SAE J1979 engine fuel rate L/h (PID 0x5E).
  # Decoded with u16_fiftieths (v0.14.3 PR #185; raw × 0.02).
  # Idle on a warm N52 should be ~1-2 L/h; wide-open throttle
  # ~50-90 L/h. Verified by design as an emissions-mandated
  # OBD-II PID; bench verification on the E9x is the
  # harness-doc gate.
  # [needs verification, N52/E9x bench]
  [[profile.param]]
  id = "fuel_rate_lh"
  label = "Engine fuel rate (L/h) [needs verification, N52/E9x bench]"
  unit = "L/h"
  target = 0x12
  query = "obd:5E"
  decode = "u16_fiftieths"
  min = 0.0
  max = 100.0

  # v0.14.5 — SAE J1979 engine runtime since start (PID 0x5F).
  # Decoded with u32_be (v0.14.3 PR #185; 4-byte BE seconds).
  # Resets on each ignition cycle; 0xFFFFFFFF is the overflow
  # sentinel. The harness doc lists runtime in its Step 2 cold
  # reading table — this entry is what populates that row.
  # [needs verification, N52/E9x bench]
  [[profile.param]]
  id = "engine_runtime"
  label = "Engine runtime [needs verification, N52/E9x bench]"
  unit = "s"
  target = 0x12
  query = "obd:5F"
  decode = "u32_be"
  min = 0.0
  max = 4294967295.0

  # v0.14.5 — SAE J1979 engine fuel rate g/s (PID 0x62).
  # Decoded with u16_half (v0.14.3 PR #185; raw × 0.5). The
  # load-bearing PID for BSFC (brake-specific fuel consumption)
  # heuristics — divide by RPM × cyl_count for instantaneous
  # BSFC. Idle on a warm N52 should be ~1-2 g/s; wide-open
  # throttle ~40-70 g/s. Verified by design as an
  # emissions-mandated OBD-II PID; bench verification on the
  # E9x is the harness-doc gate.
  # [needs verification, N52/E9x bench]
  [[profile.param]]
  id = "fuel_rate_gs"
  label = "Engine fuel rate (g/s) [needs verification, N52/E9x bench]"
  unit = "g/s"
  target = 0x12
  query = "obd:62"
  decode = "u16_half"
  min = 0.0
  max = 100.0
