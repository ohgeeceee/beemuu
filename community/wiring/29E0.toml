# Wiring Detective — circuit for DTC 29E0 (crankcase ventilation / PCV).
# Canonical source; the desktop ships an offline snapshot in
# src/js/wiring_detect.js. Keep the two in sync.

[[circuit]]
dtc = "29E0"
component = "Crankcase ventilation (PCV) heater"
ecu_pin = "X60002.31"
component_pin = "2"
power_fuse = "F08 (10A)"
ground_point = "G105"
common_failures = [
  "PCV valve diaphragm torn (oil consumption)",
  "Heater element open circuit",
]
