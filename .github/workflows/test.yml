name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Rust core (src-tauri/) ───
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # The cargo workspace lives in src-tauri/, not the repo root —
          # without this the cache probes the root, finds no Cargo.toml,
          # and keys the cache wrong (full Tauri rebuild every run).
          workspaces: src-tauri

      # Bare ubuntu-latest lacks Tauri v2's Linux system libraries
      # (glib/gtk/webkit2gtk-4.1); building glib-sys etc. fails without
      # them. Local dev never hits this because Windows provides MSVC +
      # WebView2 at OS level. Package set per Tauri 2.x prerequisites.
      # libudev-dev is for libudev-sys, pulled in by the serialport crate.
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  # ─── Python backend (backend/tests/) ───
  # The backend is stdlib-only (no requirements.txt); the only install is
  # pytest itself. Tests import `from backend import ...`, so pytest runs
  # from the repo root where the `backend` package is importable.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: pytest backend/tests/
        run: python -m pytest backend/tests/ -q

  plugins-browser:
    name: Plugin browser isolation and lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-plugins-browser.cjs

  # ─── Frontend JS unit tests (node --test, builtin runner) ───
  # Explicit globs: `node --test <dir>` mis-handles the mixed
  # .test.js / .test.cjs layout under src/js/ (verified locally on node 24).
  #
  # `npm install` is required. Most tests need only repo files and node
  # builtins, but the v3 panel tests need jsdom — and node's runner treats a
  # skipped test as a pass and exits 0, so when jsdom was absent those 28 tests
  # silently left the gate and CI stayed green. v3_ui.test.cjs now throws
  # instead of skipping, which turns a missing dependency into a red build
  # rather than a quiet hole in coverage.
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install test dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts

      - name: node --test
        run: node --test "src/js/**/*.test.js" "src/js/**/*.test.cjs" "frontend/**/*.test.js"
