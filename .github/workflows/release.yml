name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag whose release should receive the build assets
        required: true
        type: string
      source_ref:
        description: Source branch or tag to build; defaults to the triggering ref
        required: false
        type: string
      target:
        description: Which platform to build
        required: true
        default: linux
        type: choice
        options:
          - all
          - windows
          - linux

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: windows
            args: ''
          - platform: ubuntu-22.04
            target: linux
            args: '--bundles deb,appimage'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libayatana-appindicator3-dev libfuse2 \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev \
            patchelf wget xdg-utils
          sudo apt-get install -y libudev-dev

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install

      - name: Build and release
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.target
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.release_tag || github.ref_name }}
          releaseName: 'BeeEmUu ${{ inputs.release_tag || github.ref_name }}'
          releaseBody: |
            Packages in this release are built from the source commit identified by the tag. Download the assets for your operating system.

            ⚠️ Modifying vehicle electronics carries inherent risks. Always use a battery maintainer before flashing or deep coding.
          # GitHub locks published releases when immutable releases are enabled.
          # Always upload into a draft, then publish once every platform job has
          # finished and all assets are attached.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish-release:
    name: Publish release after assets are uploaded
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
