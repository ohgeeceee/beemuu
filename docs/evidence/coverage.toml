# Evidence coverage ledger (v0.22 evidence program, Update 3 prep)
#
# Every [needs verification] marker in community/profiles/*.toml maps here
# to exactly one [[entry]]: either an evidence record (status = "evidence")
# or a named gap (status = "gap"). This is the wiring that keeps unverified
# coverage explicit instead of silent.
#
# Enforced by backend/tests/test_evidence_coverage.py:
#   - every live marker must have exactly one matching [[entry]]
#   - entries whose marker no longer exists are rejected (no rot)
#   - status = "gap"      -> gap names a [gap.<name>] table below
#   - status = "evidence" -> evidence names a real docs/evidence/<file>
#
# Closing a gap: land the capture described in the gap's closes_when, then
# flip the entry to status = "evidence" and point it at the pack. Only then
# may the [needs verification] marker come off the profile label.

[gap.profile-unvalidated]
summary = "No parameter in this profile has been validated on a real vehicle; the whole profile ships as community-researched."
closes_when = "Evidence records exist for the profile's core DID/PID set and the profile-level [needs verification] marker is removed from the label."

[gap.obdb-mirror-unvalidated]
summary = "DID and decode mirrored from the OBDb-researched (CC-BY-SA 4.0) F-series DME set shipped in b58.toml / n20.toml; never confirmed answered on a real car of this family."
closes_when = "A real-car UDS capture of this DID (request, raw positive-response payload, expected decoded value, provenance) lands in a docs/evidence/<family>.uds.json pack, cross-checked against ISTA or a known-good tool."

[gap.uds-did-unvalidated]
summary = "UDS DID carried from family research; decode is implemented but the DID's availability and payload semantics are unconfirmed on a real car (some target a non-DME ECU, e.g. EGS gear position, or the diesel DDE)."
closes_when = "A real-car UDS capture of this DID (request, raw positive-response payload, expected decoded value, provenance) lands in a docs/evidence/<family>.uds.json pack."

[gap.obd-bench-unvalidated]
summary = "Standard OBD-II mode-01 PID; decode math is implemented, but the marked chassis bench check has not been run."
closes_when = "A bench or real-car capture of the PID reply with the expected decoded value lands in a docs/evidence/<family> pack."

